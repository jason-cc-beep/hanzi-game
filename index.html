<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字大冒险 - 小学语文乐园</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
html,body { height:100%; }
body {
  min-height:100vh;
  background: linear-gradient(160deg,#e0f7ff 0%,#fff0f6 45%,#fff7e6 100%);
  overflow-x:hidden;
  user-select:none;
}
#bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

#app { position:relative; z-index:1; max-width:980px; margin:0 auto; padding:16px 14px 40px; }
.screen { display:none; animation: fadeIn .35s ease; }
.screen.active { display:block; }
@keyframes fadeIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

/* ---------- 首页 ---------- */
.logo {
  text-align:center; font-size:56px; font-weight:900; margin-top:34px;
  background: linear-gradient(90deg,#ff6b6b,#ff9f43,#ffd93d,#6bcb77,#4d96ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  animation: logoBounce 2.4s ease-in-out infinite;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.12));
}
@keyframes logoBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
.subtitle { text-align:center; font-size:19px; color:#6b7280; margin:10px 0 30px; letter-spacing:2px; }
.mascot { text-align:center; font-size:74px; margin:8px 0 18px; animation: wiggle 2.8s ease-in-out infinite; }
@keyframes wiggle { 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);} }
.big-btn {
  display:block; margin:14px auto; padding:16px 44px; font-size:26px; font-weight:bold;
  color:#fff; background:linear-gradient(135deg,#ff6b6b,#ff9f43);
  border:none; border-radius:60px; cursor:pointer;
  box-shadow:0 6px 18px rgba(255,107,107,.4);
  transition:transform .18s, box-shadow .18s;
}
.big-btn:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 10px 26px rgba(255,107,107,.5); }
.big-btn:active { transform:scale(.96); }
.big-btn.gray { background:linear-gradient(135deg,#aab,#889); box-shadow:0 6px 18px rgba(136,136,136,.35); }
.home-stats { text-align:center; margin-top:22px; font-size:20px; color:#8a5a00; }
.home-stats b { font-size:26px; }
.sound-toggle {
  position:fixed; top:16px; right:18px; z-index:9;
  width:46px; height:46px; border-radius:50%; font-size:22px; cursor:pointer;
  background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.15); border:none; line-height:46px; text-align:center;
}
.sound-toggle.off { filter:grayscale(1); opacity:.55; }

/* ---------- 通用头部 ---------- */
.screen-header { display:flex; align-items:center; gap:12px; margin:6px 0 18px; }
.back-btn {
  width:44px; height:44px; border-radius:50%; font-size:22px; cursor:pointer;
  background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.14); border:none; flex:none;
}
.back-btn:active { transform:scale(.92); }
.screen-header h2 { font-size:28px; color:#333; }

/* ---------- 年级选择 ---------- */
.grade-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.grade-card {
  border-radius:22px; padding:26px 10px 20px; text-align:center; cursor:pointer;
  color:#fff; box-shadow:0 6px 16px rgba(0,0,0,.14);
  transition:transform .18s;
}
.grade-card:hover { transform:translateY(-5px) scale(1.04); }
.grade-card:active { transform:scale(.95); }
.grade-num { font-size:52px; font-weight:900; text-shadow:0 3px 6px rgba(0,0,0,.2); }
.grade-name { font-size:20px; margin-top:6px; font-weight:bold; }
.grade-tag { font-size:13px; opacity:.92; margin-top:4px; }

/* ---------- 模式选择 ---------- */
.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.mode-card {
  border-radius:24px; padding:24px 18px; cursor:pointer; background:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.10); border:3px solid transparent;
  transition:transform .18s, border-color .18s;
  text-align:center;
}
.mode-card:hover { transform:translateY(-4px); border-color:#ff9f43; }
.mode-card:active { transform:scale(.96); }
.mode-icon { font-size:52px; }
.mode-name { font-size:22px; font-weight:bold; color:#333; margin-top:8px; }
.mode-desc { font-size:13.5px; color:#888; margin-top:6px; line-height:1.5; }

/* ---------- 关卡选择 ---------- */
.level-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:18px; }
.level-btn {
  aspect-ratio:1; border-radius:16px; font-size:22px; font-weight:bold; cursor:pointer;
  background:#fff; color:#333; border:2px solid #e5e7eb; box-shadow:0 3px 8px rgba(0,0,0,.08);
  display:flex; align-items:center; justify-content:center; position:relative;
  transition:transform .15s;
}
.level-btn:hover { transform:translateY(-3px); border-color:#ff9f43; }
.level-btn.cur { background:linear-gradient(135deg,#ff6b6b,#ff9f43); color:#fff; border-color:transparent; animation:popIn .3s ease; }
.level-btn.cur::after { content:'▶'; position:absolute; top:-9px; right:-9px; font-size:14px; background:#fff; border-radius:50%; width:22px; height:22px; line-height:22px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
.level-btn.locked { background:#f1f2f6; color:#c0c4cc; cursor:not-allowed; }
.level-btn.locked:hover { transform:none; border-color:#e5e7eb; }
.level-btn .lv-star { position:absolute; top:-8px; left:-8px; font-size:15px; }

/* ---------- 游戏顶部 ---------- */
.game-top {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border-radius:60px; padding:8px 12px 8px 8px;
  box-shadow:0 4px 14px rgba(0,0,0,.10); margin-bottom:16px;
}
.top-info { flex:1; display:flex; align-items:center; gap:10px; font-size:18px; font-weight:bold; color:#444; }
.progress { background:#fff3cd; color:#b8860b; border-radius:30px; padding:4px 12px; font-size:14px; }
.top-right { display:flex; align-items:center; gap:10px; font-size:16px; }
.coin { background:#fff8e1; border-radius:30px; padding:4px 12px; color:#b8860b; font-weight:bold; }
.combo { background:#ffe0e0; border-radius:30px; padding:4px 10px; color:#e53935; font-weight:bold; display:none; }
.combo.show { display:inline-block; animation: popIn .25s ease; }

/* ---------- 消消乐 ---------- */
.match-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; max-width:640px; margin:0 auto; }
.bubble {
  width:96px; height:96px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:bold; color:#fff; cursor:pointer; position:relative;
  box-shadow:0 6px 14px rgba(0,0,0,.16), inset 0 -5px 10px rgba(0,0,0,.12), inset 0 5px 10px rgba(255,255,255,.35);
  transition:transform .18s, box-shadow .18s;
  text-shadow:0 2px 3px rgba(0,0,0,.25);
  animation: floatIn .4s ease backwards;
}
.bubble::before { content:''; position:absolute; top:12px; left:14px; width:26px; height:13px;
  background:rgba(255,255,255,.45); border-radius:50%; filter:blur(4px); }
.bubble:hover { transform:scale(1.08); }
.bubble.big { font-size:34px; }
.bubble.mid { font-size:20px; }
.bubble.small { font-size:16px; }
.bubble.sq { width:auto; min-width:118px; height:78px; border-radius:40px; padding:0 16px; }
.bubble.sq.big { font-size:26px; }
.bubble.sq.small { font-size:14px; }
.bubble.selected {
  transform:scale(1.12); outline:4px solid #ffd700; box-shadow:0 0 22px #ffd700;
  animation: popIn .22s ease;
}
.bubble.done { animation: popUp .5s ease forwards; pointer-events:none; }
.bubble.wrong { animation: shake .45s ease; box-shadow:0 0 18px #ff5252, 0 6px 14px rgba(0,0,0,.16); }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
@keyframes popUp { 0%{transform:translateY(0) scale(1); opacity:1;} 100%{transform:translateY(-50px) scale(.3); opacity:0;} }
@keyframes floatIn { from{transform:translateY(24px) scale(.6); opacity:0;} to{transform:none; opacity:1;} }
@keyframes popIn { 0%{transform:scale(.6);} 60%{transform:scale(1.15);} 100%{transform:scale(1);} }

/* ---------- 选择题 ---------- */
.quiz-card {
  background:#fff; border-radius:30px; padding:34px 20px; text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.10); max-width:560px; margin:8px auto 22px;
}
.quiz-char { font-size:110px; font-weight:900; color:#4d96ff; line-height:1.2; animation:popIn .3s ease; }
.quiz-pin { font-size:30px; color:#ff9f43; margin-top:4px; font-weight:bold; }
.quiz-label { font-size:17px; color:#999; margin-top:10px; }
.quiz-word { font-size:48px; font-weight:bold; color:#6bcb77; line-height:1.3; }
.chain-box { font-size:16px; color:#666; margin-top:14px; line-height:1.8; }
.chain-box b { color:#4d96ff; }
.chain-char { display:inline-block; font-size:44px; font-weight:900; color:#ff6b6b; margin:8px 10px 0; animation:popIn .3s ease; }
.chain-pin { font-size:18px; color:#b8860b; font-weight:bold; }

.quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:560px; margin:0 auto; }
.opt {
  padding:20px 8px; font-size:24px; font-weight:bold; border-radius:20px; cursor:pointer;
  background:#fff; border:3px solid #e5e7eb; color:#333; box-shadow:0 4px 10px rgba(0,0,0,.07);
  transition:transform .15s;
}
.opt:hover { transform:translateY(-3px); border-color:#ff9f43; }
.opt:active { transform:scale(.95); }
.opt.correct { background:#6bcb77 !important; color:#fff !important; border-color:#6bcb77 !important; animation:popIn .3s ease; }
.opt.wrong { background:#ff6b6b !important; color:#fff !important; border-color:#ff6b6b !important; animation:shake .45s ease; }
.opt.dim { opacity:.45; }

/* ---------- 提示按钮 / 学习卡 / 成就任务 ---------- */
.timer-pill {
  padding:5px 12px; border-radius:30px; font-size:15px; font-weight:bold; color:#555;
  background:#eef2ff; border:1px solid #dbe3ff;
}
.hint-btn {
  padding:6px 14px; border-radius:30px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#4d96ff,#6bcb77); color:#fff; font-size:15px; font-weight:bold;
  box-shadow:0 3px 8px rgba(77,150,255,.35); transition:transform .15s;
}
.hint-btn:hover { transform:translateY(-2px); }
.hint-btn.off { background:#ccc; box-shadow:none; cursor:not-allowed; }
.bubble.hintglow { animation:hintPulse .55s ease 3; outline:4px solid #4d96ff; box-shadow:0 0 24px #4d96ff; }
@keyframes hintPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.13);} }

.learn-card { max-width:340px; }
.learn-big { font-size:88px; font-weight:900; color:#4d96ff; line-height:1.15; }
.learn-pin { font-size:26px; color:#ff9f43; font-weight:bold; margin-top:2px; }
.learn-extra { font-size:19px; color:#555; margin-top:10px; line-height:1.6; }
.learn-tip { font-size:14px; color:#999; margin:12px 0 4px; }

.home-btns { display:flex; justify-content:center; gap:12px; margin-top:16px; }
.chip-btn {
  padding:10px 20px; font-size:16px; font-weight:bold; border-radius:40px; cursor:pointer;
  background:#fff; color:#e07a3f; border:2px solid #ffd9b8; box-shadow:0 3px 10px rgba(0,0,0,.08);
  transition:transform .15s;
}
.chip-btn:hover { transform:translateY(-2px); }
.home-title { color:#bb8fce; font-size:18px; }

.ach-list { text-align:left; max-height:52vh; overflow-y:auto; padding:4px 6px; }
.ach-item { display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:14px; margin-bottom:8px; }
.ach-item.got { background:#fff8e1; border:1px solid #ffd54f; }
.ach-item.lock { background:#f4f5f7; opacity:.6; }
.ach-icon { font-size:30px; }
.ach-name { font-weight:bold; color:#333; font-size:16px; }
.ach-desc { font-size:12.5px; color:#999; margin-top:2px; }
.task-item { display:flex; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px dashed #eee; }
.task-name { flex:1; font-size:16px; color:#444; }
.task-prog { font-size:13px; color:#999; }
.task-bar { height:8px; background:#eee; border-radius:6px; overflow:hidden; margin:5px 0 2px; }
.task-bar i { display:block; height:100%; background:linear-gradient(90deg,#ffd93d,#ff9f43); border-radius:6px; transition:width .3s; }
.task-done { font-size:18px; }
.streak-line { font-size:15px; color:#e07a3f; font-weight:bold; margin-bottom:10px; }

/* ---------- 结算弹窗 ---------- */
.modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; animation:fadeIn .25s ease; }
.modal-card {
  background:#fff; border-radius:30px; padding:34px 30px 26px; text-align:center;
  width:min(92vw,420px); box-shadow:0 16px 50px rgba(0,0,0,.3);
  animation:modalIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn { from{transform:scale(.5) translateY(40px); opacity:0;} to{transform:none; opacity:1;} }
.stars { font-size:58px; letter-spacing:8px; }
.stars span { display:inline-block; }
.stars span.star-in { animation:starIn .5s ease backwards; }
@keyframes starIn { from{transform:scale(0) rotate(-180deg);} to{transform:scale(1) rotate(0);} }
.modal-title { font-size:30px; font-weight:900; color:#333; margin:8px 0 6px; }
.modal-info { font-size:18px; color:#777; margin-bottom:14px; line-height:1.7; }
.modal-info b { color:#ff9f43; font-size:24px; }

/* ---------- 提示条 ---------- */
.hint-bar {
  text-align:center; font-size:15px; color:#8a5a00; background:#fff3cd;
  border-radius:20px; padding:8px 16px; margin:12px auto 0; max-width:560px;
}

/* 彩带粒子 */
.fx { position:fixed; z-index:100; pointer-events:none; border-radius:3px; animation:fxUp linear forwards; }
@keyframes fxUp { to { transform: translateY(-70px) rotate(240deg); opacity:0; } }

/* 拼出成语提示 */
.cheng-toast {
  position:fixed; top:88px; left:50%; transform:translateX(-50%) translateY(-12px);
  background:rgba(255,255,255,.96); color:#ff6b6b; font-size:26px; font-weight:bold;
  padding:10px 28px; border-radius:30px; box-shadow:0 6px 20px rgba(0,0,0,.18);
  opacity:0; transition:opacity .25s, transform .25s; z-index:40; pointer-events:none; white-space:nowrap;
}
.cheng-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.float-star { position:fixed; z-index:0; pointer-events:none; opacity:.5; animation:floatY linear infinite; }
@keyframes floatY { 0%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-26px) rotate(14deg);} 100%{transform:translateY(0) rotate(0);} }

@media (max-width:640px){
  .grade-grid{ grid-template-columns:1fr 1fr; }
  .mode-grid{ grid-template-columns:1fr; }
  .bubble{ width:76px; height:76px; font-size:24px; }
  .bubble.big{ font-size:28px; }
  .bubble.mid{ font-size:17px; }
  .bubble.small{ font-size:13px; }
  .bubble.sq{ min-width:92px; height:62px; padding:0 10px; }
  .quiz-char{ font-size:84px; }
  .logo{ font-size:42px; }
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div id="app">

  <!-- 首页 -->
  <div id="screen-home" class="screen active">
    <div class="mascot">📚✨</div>
    <h1 class="logo">汉字大冒险</h1>
    <p class="subtitle">小学语文 1~6 年级 · 生字 · 拼音 · 成语 · 组词</p>
    <button class="big-btn" onclick="goGrade()">🚀 开始冒险</button>
    <div class="home-stats">我的金币 🪙 <b id="coinHome">0</b> <span class="home-title" id="homeTitle"></span></div>
    <div class="home-btns">
      <button class="chip-btn" onclick="showDaily()">📋 今日任务</button>
      <button class="chip-btn" onclick="showAch()">🏆 成就</button>
    </div>
  </div>

  <!-- 年级选择 -->
  <div id="screen-grade" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goHome()">🏠</button>
      <h2>选择年级</h2>
    </div>
    <div class="grade-grid" id="gradeGrid"></div>
  </div>

  <!-- 模式选择 -->
  <div id="screen-mode" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goGrade()">⬅</button>
      <h2 id="modeTitle">一年级</h2>
    </div>
    <div class="mode-grid" id="modeGrid"></div>
    <div class="hint-bar" id="modeHint">💡 每答对一题 +10 金币，连续答对还有连击奖励！</div>
  </div>

  <!-- 关卡选择 -->
  <div id="screen-levels" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="goMode()">⬅</button>
      <h2 id="levelsTitle">生字消消乐 · 一年级</h2>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="hint-bar" id="levelsHint">🌟 每关难度递增：泡泡更多、超纲字更多，通关解锁下一关！</div>
  </div>

  <!-- 游戏页 -->
  <div id="screen-game" class="screen">
    <div class="game-top">
      <button class="back-btn" onclick="quitGame()">⬅</button>
      <div class="top-info">
        <span id="gameTitle">生字消消乐</span>
        <span class="progress" id="progressText">0/10</span>
      </div>
      <div class="top-right">
        <span class="timer-pill" id="timerText">⏱ 00:00</span>
        <button class="hint-btn" id="hintBtn" onclick="useHint()">💡 3</button>
        <span class="coin">🪙<b id="coinGame">0</b></span>
        <span class="combo" id="comboText">🔥x2</span>
      </div>
    </div>
    <div id="gameArea"></div>
  </div>

  <!-- 结算弹窗 -->
  <div id="modal" class="modal" style="display:none">
    <div class="modal-card">
      <div class="stars" id="stars"></div>
      <div class="modal-title" id="modalTitle">太棒了！</div>
      <div class="modal-info" id="modalInfo"></div>
      <button class="big-btn" id="modalBtn1" onclick="startNext()">▶ 下一关</button>
      <button class="big-btn gray" onclick="quitGame()">🏠 返回</button>
    </div>
  </div>

  <!-- 答错学习卡 -->
  <div id="learnModal" class="modal" style="display:none">
    <div class="modal-card learn-card">
      <div class="learn-big" id="learnBig"></div>
      <div class="learn-pin" id="learnPin"></div>
      <div class="learn-extra" id="learnExtra"></div>
      <div class="learn-tip">💡 记住它，下次再来挑战！</div>
      <button class="big-btn" onclick="closeLearn()">知道了</button>
    </div>
  </div>

  <!-- 每日任务面板 -->
  <div id="panelDaily" class="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">📋 今日任务</div>
      <div class="streak-line" id="streakLine"></div>
      <div class="ach-list" id="dailyList"></div>
      <button class="big-btn gray" onclick="closePanel('panelDaily')">关闭</button>
    </div>
  </div>

  <!-- 成就面板 -->
  <div id="panelAch" class="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">🏆 我的成就</div>
      <div class="ach-list" id="achList"></div>
      <button class="big-btn gray" onclick="closePanel('panelAch')">关闭</button>
    </div>
  </div>

</div>

<button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>

<script>
"use strict";
/* ================= 音效系统 (Web Audio 生成, 无需外部文件) ================= */
const SOUND = {
  ctx:null, on:true,
  init(){
    if(!this.ctx){
      try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  tone(f,d=0.14,t='sine',v=0.16,delay=0){
    if(!this.on||!this.ctx) return;
    const T = this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=t; o.frequency.value=f;
    g.gain.setValueAtTime(v,T);
    g.gain.exponentialRampToValueAtTime(0.001,T+d);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(T); o.stop(T+d);
  },
  click(){ this.tone(660,.05,'triangle',.1); },
  pop(){ this.tone(320,.09,'sine',.2); this.tone(660,.07,'sine',.12,.05); },
  correct(){ [523,659,784].forEach((f,i)=>this.tone(f,.13,'sine',.2,i*.09)); },
  star(){ this.tone(1047,.12,'sine',.18); this.tone(1568,.16,'sine',.14,.07); },
  wrong(){ this.tone(233,.2,'sawtooth',.13); this.tone(185,.28,'sawtooth',.12,.12); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone(f,.16,'triangle',.2,i*.11)); },
  lose(){ [392,330,262].forEach((f,i)=>this.tone(f,.22,'sine',.18,i*.14)); }
};
function toggleSound(){
  SOUND.on=!SOUND.on;
  document.getElementById('soundBtn').textContent=SOUND.on?'🔊':'🔇';
  document.getElementById('soundBtn').classList.toggle('off',!SOUND.on);
  if(SOUND.on){ SOUND.init(); SOUND.click(); }
}

/* ================= 彩带粒子特效 ================= */
function spawnFx(x,y,n=14,emoji=''){
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='fx';
    const size=6+Math.random()*10;
    d.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;
      background:${['#ff6b6b','#ff9f43','#ffd93d','#6bcb77','#4d96ff','#bb8fce'][i%6]};
      animation-duration:${700+Math.random()*800}ms;
      transform:rotate(${Math.random()*360}deg);`;
    if(emoji){ d.style.background='none'; d.style.fontSize=(size+10)+'px'; d.textContent=emoji; }
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),1600);
  }
}
function rainCelebrate(){
  for(let i=0;i<26;i++){
    setTimeout(()=>{
      spawnFx(Math.random()*innerWidth, innerHeight*(0.35+Math.random()*0.55), 1, ['🎉','⭐','🎊','✨','❤️'][Math.floor(Math.random()*5)]);
    }, i*70);
  }
}
function fireworkAt(el){
  if(!el) return;
  const r=el.getBoundingClientRect();
  spawnFx(r.left+r.width/2, r.top+r.height/2, 16);
}

function showResult(){
  stopTimer();
  const el=document.getElementById('modal');
  const stars = qState.right/qState.total >= 1 ? 3 : qState.right/qState.total >= .7 ? 2 : 1;
  /* 保存本关最高星级 */
  const starMap=getStars();
  const sk=G.grade+'_'+G.mode;
  starMap[sk]=starMap[sk]||{};
  starMap[sk][G.level]=Math.max(starMap[sk][G.level]||0, stars);
  saveStars(starMap);
  document.getElementById('stars').innerHTML =
    [1,2,3].map(i=>`<span class="${i<=stars?'star-in':''}" style="animation-delay:${i*250}ms">${i<=stars?'⭐':'☆'}</span>`).join('');
  const secs=Math.round((Date.now()-qState.startTime)/1000);
  const gain=stars*10 + (G.mode==='match'?20:0);
  addCoin(gain);
  // 通关解锁下一关
  const key=G.grade+'_'+G.mode;
  const prog=getProgress();
  const isNew=(prog[key]||1)<=G.level && G.level<30;
  if(isNew){ prog[key]=G.level+1; setProgress(prog); }
  const titles=['继续加油，再来一次！','真棒，答得很好！','太厉害了，全对满分！'];
  document.getElementById('modalTitle').textContent = stars===3 ? titles[2] : stars===2 ? titles[1] : titles[0];
  document.getElementById('modalBtn1').textContent = G.level<30 ? '▶ 下一关' : '🔄 再来一局';
  document.getElementById('modalInfo').innerHTML =
    `答对 <b>${qState.right}</b> 对 / 共 <b>${qState.total}</b> 对 · 用时 <b>${fmtTime(secs)}</b><br>`+
    (qState.bestCombo>=2?`最佳连击 <b>${qState.bestCombo}</b> 🔥 · `:'')+
    `获得金币 <b>+${gain}</b> 🪙`+
    (isNew?`<br>🎉 解锁了第 <b>${G.level+1}</b> 关！`:G.level===30?`<br>🏆 第30关通关，你太棒了！`:'')+
    `<br>💾 进度已自动保存`;
  if(stars===3){ SOUND.win(); rainCelebrate(); } else if(stars===2){ SOUND.win(); } else { SOUND.lose(); }
  later(()=>{ el.style.display='flex'; }, stars===3?500:250);

  /* ---- 统计 / 每日任务 / 成就 ---- */
  const st=getStats();
  st.cleared=(st.cleared||0)+1;
  if(stars===3) st.star3=(st.star3||0)+1;
  st.bestCombo=Math.max(st.bestCombo||0, qState.bestCombo);
  if(G.mode==='chengyu') st.chengCleared=(st.chengCleared||0)+1;
  if(G.level===30) st.level30=true;
  const today=todayStr();
  if(st.lastDate!==today){
    st.days=(st.days||0)+1;
    st.streak = st.lastDate===yesterdayStr() ? (st.streak||0)+1 : 1;
    st.lastDate=today;
  }
  saveStats(st);
  const d=getDaily();
  let taskGold=0;
  d.tasks.forEach(t=>{
    if(t.done) return;
    const def=TASK_POOL.find(x=>x.id===t.id);
    if(!def) return;
    let step=0;
    if(t.id==='play1'||t.id==='play3') step=1;
    else if(t.id==='star3') step=stars===3?1:0;
    else if(t.id==='combo5') step=qState.bestCombo>=5?1:0;
    else if(t.id==='cheng') step=G.mode==='chengyu'?1:0;
    else if(t.id==='word') step=G.mode==='wordgame'?1:0;
    else if(t.id==='gold50') step=gain;
    else if(t.id==='perfect') step=qState.wrong===0?1:0;
    t.prog+=step;
    if(t.prog>=def.target){ t.done=true; taskGold+=20; }
  });
  saveDaily(d);
  if(taskGold>0){ addCoin(taskGold); later(()=>showTip('✅ 完成每日任务 +'+taskGold+' 金币！'),900); }
  const unlocked=getAchIds();
  const newAch=ACHIEVEMENTS.filter(a=>!unlocked.includes(a.id) && a.cond(st));
  if(newAch.length){
    const ids=new Set(unlocked); newAch.forEach(a=>ids.add(a.id));
    saveAch(ids);
    later(()=>showTip('🎉 解锁成就：'+newAch[0].icon+' '+newAch[0].name),1200);
  }
}

/* ================= 统一消消乐引擎（四类配对玩法） ================= */
/* 年级混合抽样：当前年级60%，之前年级30%，超纲10%（extraRatio随关卡调整） */
function mergedChars(grade){
  const map=new Map();
  for(let g=1;g<=grade;g++) for(const c of GRADE_DATA[g]) map.set(c[0],c);
  return [...map.values()];
}
/* 超纲字池：低年级取高年级的字，六年级取初中常用字库 */
function extraChars(grade){
  if(grade<6){
    const all=[];
    for(let g=grade+1;g<=6;g++) all.push(...GRADE_DATA[g]);
    return all;
  }
  return EXTRA6;
}
function findChar(c){
  for(let g=1;g<=6;g++){ const f=GRADE_DATA[g].find(x=>x[0]===c); if(f) return f; }
  const f=EXTRA6.find(x=>x[0]===c); if(f) return f;
  return null;
}
/* 关卡历史（本玩法之前关卡用过的字/成语），供20%重复复习 */
function getHistoryAll(){ try{ return JSON.parse(localStorage.getItem('hzw_hist')||'{}'); }catch(e){ return {}; } }
function getHistoryList(){ const h=getHistoryAll(); return h[G.grade+'_'+G.mode]||[]; }
function recordUsedList(list){
  const h=getHistoryAll(); const key=G.grade+'_'+G.mode;
  const arr=h[key]||[]; const set=new Set(arr);
  for(const x of list) if(!set.has(x)){ set.add(x); arr.push(x); }
  h[key]=arr;
  try{ localStorage.setItem('hzw_hist', JSON.stringify(h)); }catch(e){}
}
function levelSample(grade,n,extraRatio,filter,exclude){
  const cur=[...GRADE_DATA[grade]].filter(c=>!filter||filter(c));
  const rest=mergedChars(grade).filter(c=>!cur.some(x=>x[0]===c[0]) && (!filter||filter(c)));
  const extra=extraChars(grade).filter(c=>!cur.some(x=>x[0]===c[0]) && !rest.some(x=>x[0]===c[0]) && (!filter||filter(c)));
  const out=[]; const used=new Set(exclude||[]);
  const pickFrom=(pool)=>{ const p=pool.filter(c=>!used.has(c[0])); if(!p.length) return null; const c=p[randInt(p.length)]; used.add(c[0]); return c; };
  // 保底：每局至少 1~2 个之前年级的字，保证复习效果
  if(rest.length){
    const minPrev=Math.max(1, Math.min(2, Math.floor(n*0.15)));
    for(let i=0;i<minPrev;i++){ const c=pickFrom(rest); if(c) out.push(c); }
  }
  // 超纲字：按关卡比例抽取（低关少、高关多）
  const extraCount=Math.round(n*extraRatio);
  for(let i=0;i<extraCount;i++){ const c=pickFrom(extra); if(!c) break; out.push(c); }
  while(out.length<n){
    const r=Math.random();
    const pool = rest.length===0 ? (r<0.9?cur:extra) : (r<0.6?cur:(r<0.9?rest:extra));
    const c = pickFrom(pool) || pickFrom(cur) || pickFrom(rest) || pickFrom(extra);
    if(!c) break;
    out.push(c);
  }
  return out;
}
function findCharPinyin(ch){
  for(let g=1;g<=6;g++){ const f=GRADE_DATA[g].find(x=>x[0]===ch); if(f) return f[1]; }
  const f=EXTRA6.find(x=>x[0]===ch); if(f) return f[1];
  return null;
}
/* 组词拼音修正表：多音字在词中的真实读音 + 轻声词 */
const WORD_PIN_FIX={
  "炸弹":["zhà","dàn"],"婀娜":["ē","nuó"],"哄笑":["hōng","xiào"],"放假":["jià","fàng"],
  "喧哗":["xuān","huá"],"子弹":["zǐ","dàn"],"调动":["diào","dòng"],"塞子":["sāi","zi"],
  "冠军":["guàn","jūn"],"睡觉":["shuì","jiào"],"重量":["zhòng","liàng"],"着急":["zháo","jí"],
  "质量":["zhì","liàng"],"缘分":["yuán","fèn"],"殷切":["yīn","qiè"],"呜咽":["wū","yè"],
  "偿还":["cháng","huán"],"桅杆":["wéi","gān"],"暖和":["nuǎn","huo"],"眼睛":["yǎn","jing"],
  "石头":["shí","tou"],"月亮":["yuè","liang"],"时候":["shí","hou"],"早上":["zǎo","shang"],
  "晚上":["wǎn","shang"],"耳朵":["ěr","duo"],"尾巴":["wěi","ba"],"下巴":["xià","ba"],
  "狐狸":["hú","li"],"葡萄":["pú","tao"],"葫芦":["hú","lu"],"胳膊":["gē","bo"],
  "喜欢":["xǐ","huan"],"朋友":["péng","you"],"衣服":["yī","fu"],"事情":["shì","qing"],
  "告诉":["gào","su"],"老师":["lǎo","shi"],"爸爸":["bà","ba"],"妈妈":["mā","ma"],
  "哥哥":["gē","ge"],"姐姐":["jiě","jie"],"弟弟":["dì","di"],"叔叔":["shū","shu"],
  "爷爷":["yé","ye"],"娃娃":["wá","wa"],"星星":["xīng","xing"]
};
/* 组词完整拼音：按词序逐字取音，如 水果 → shuǐ guǒ；拼不出则返回 null */
function wordPin(c){
  const w=c[2];
  if(w.length!==2) return null;
  if(WORD_PIN_FIX[w]) return WORD_PIN_FIX[w].join(' ');
  const p0=findCharPinyin(w[0]), p1=findCharPinyin(w[1]);
  if(!p0||!p1) return null;
  return p0+' '+p1;
}
/* 随机挑一条成语链：超纲链(高关卡)→之前年级链→当前年级链 */
function pickChain(grade, level){
  const prev=[];
  for(let g=1;g<grade;g++) for(const ch of CHENYU[g].chains) prev.push(ch);
  const r=Math.random();
  const extraR = level>=21 ? 0.45 : level>=11 ? 0.2 : 0;
  if(extraR && r<extraR) return EXTRA_CHENYU[randInt(EXTRA_CHENYU.length)];
  if(prev.length && r<(0.4+extraR)) return prev[randInt(prev.length)];
  return CHENYU[grade].chains[randInt(CHENYU[grade].chains.length)];
}
/* 取 n 个成语：20% 从历史（之前关卡玩过的成语）复习，其余取接龙链，不足时补足 */
function pickChengyus(grade,n){
  const seen=new Set();
  const out=[];
  // 20% 历史复习
  const hist=getHistoryList();
  shuffle(hist);
  const repeatCount=Math.round(n*0.2);
  for(const w of hist){
    if(out.length>=repeatCount) break;
    if(seen.has(w)) continue;
    seen.add(w); out.push(w);
  }
  // 取接龙链
  const chain=pickChain(grade, G.level||1);
  for(const w of chain){ if(!seen.has(w) && out.length<n){ seen.add(w); out.push(w); } }
  // 补足
  if(out.length<n){
    const all=[];
    for(let g=1;g<=grade;g++) for(const ch of CHENYU[g].chains) for(const w of ch){ if(!seen.has(w)){ seen.add(w); all.push(w); } }
    for(const ch of EXTRA_CHENYU) for(const w of ch){ if(!seen.has(w)){ seen.add(w); all.push(w); } }
    shuffle(all);
    while(out.length<n && all.length) out.push(all.pop());
  }
  return out.slice(0,n);
}
/* 把成语拆成两个字块：双字+双字为主，四字成语约35%拆成 单字+三字 */
function splitCheng(yu){
  const n=yu.length;
  if(n===4 && Math.random()<0.35) return [yu[0], yu.slice(1)];
  const m=Math.floor(n/2);
  return [yu.slice(0,m), yu.slice(m)];
}

let pState={ items:[], first:null, second:null, lock:false, done:0 };
function updateProgress(){
  const t=document.getElementById('progressText');
  t.textContent=`${pState.done/2}/${pState.items.length/2}`;
}
/* 顶部提示条（拼出成语 / 顺序提醒 / 解锁提示），fixed 定位挂在 body */
let tipEl=null;
function showTip(text){
  if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='cheng-toast'; document.body.appendChild(tipEl); }
  tipEl.textContent=text;
  tipEl.classList.remove('show');
  void tipEl.offsetWidth;
  tipEl.classList.add('show');
  later(()=>tipEl.classList.remove('show'),1600);
}
function showChengToast(yu){ showTip('成语：'+yu); }

/* ---------- 答错学习卡 ---------- */
function learnInfoFromId(id){
  if(id.charAt(0)==='m'||id.charAt(0)==='w'){
    const ch=findChar(id.charAt(1));
    if(ch) return {big:ch[0], pin:ch[1], extra:'组词：'+ch[2]};
  }
  if(id.charAt(0)==='p'){
    const parts=id.slice(1).split('|');
    return {big:parts[1], pin:parts[0], extra:''};
  }
  if(id.charAt(0)==='c'){
    const yu=id.slice(1);
    const pi=CHENYU_PIN[yu]||null;
    const pin=[...yu].map((ch,i)=> findCharPinyin(ch) || (pi && (i===0||i===yu.length-1)? pi[i===0?0:1] : '·')).join(' ');
    return {big:yu, pin:pin, extra:''};
  }
  return null;
}
function showLearnCard(id){
  const info=learnInfoFromId(id);
  if(!info) return;
  document.getElementById('learnBig').textContent=info.big;
  document.getElementById('learnPin').textContent=info.pin||'';
  document.getElementById('learnExtra').textContent=info.extra||'';
  document.getElementById('learnModal').style.display='flex';
  SOUND.lose();
  later(closeLearn,3200);
}
function closeLearn(){ document.getElementById('learnModal').style.display='none'; }

/* ---------- 提示按钮 ---------- */
function useHint(){
  if(pState.lock) return;
  if(G.hints<=0){ showTip('提示次数用完了！'); return; }
  G.hints--;
  document.getElementById('hintBtn').textContent='💡 '+G.hints;
  if(G.hints<=0) document.getElementById('hintBtn').classList.add('off');
  if(pState.first!==null){
    const sel=document.querySelectorAll('#gameArea .bubble')[pState.first];
    if(sel) sel.classList.remove('selected');
    pState.first=null;
  }
  let pi=null, pj=null;
  for(let i=0;i<pState.items.length && !pi;i++){
    if(pState.items[i].done) continue;
    for(let j=i+1;j<pState.items.length;j++){
      if(!pState.items[j].done && pState.items[j].pair===pState.items[i].pair){ pi=i; pj=j; break; }
    }
  }
  if(pi===null) return;
  const els=document.querySelectorAll('#gameArea .bubble');
  if(!els[pi]||!els[pj]) return;
  els[pi].classList.add('hintglow'); els[pj].classList.add('hintglow');
  SOUND.star();
  later(()=>{ els[pi].classList.remove('hintglow'); els[pj].classList.remove('hintglow'); },1600);
}

/* 每关抽样：20% 从本玩法历史（之前关卡玩过的字）中复习抽取，80% 正常抽取 */
function gameSample(grade,n,extraRatio,filter){
  const hist=getHistoryList();
  const histChars=shuffle(hist.map(findChar).filter(Boolean).filter(c=>!filter||filter(c)));
  const used=new Set();
  const out=[];
  const repeatCount=Math.round(n*0.2);
  for(const c of histChars){
    if(out.length>=repeatCount) break;
    if(used.has(c[0])) continue;
    used.add(c[0]); out.push(c);
  }
  const fresh=levelSample(grade, n-out.length, extraRatio, filter, [...used]);
  for(const c of fresh) out.push(c);
  return out;
}
/* 生成配对数据：{a:{t,shp,s}, b:{t,shp,s}}，n=对数，extra=超纲比例 */
function buildPairs(kind, n, extra){
  const g=G.grade;
  if(kind==='match'){
    return gameSample(g,n,extra).map(c=>({a:{t:c[0],shp:'circle',s:'big'}, b:{t:c[1],shp:'circle',s:'small'}, id:'m'+c[0]+c[1]}));
  }
  if(kind==='wordgame'){
    return gameSample(g,n,extra).map(c=>({a:{t:c[0],shp:'circle',s:'big'}, b:{t:c[2],shp:'sq',s:'mid'}, id:'w'+c[0]+c[2]}));
  }
  if(kind==='pinyinv'){
    return gameSample(g,n,extra,c=>c[2].length===2&&wordPin(c)).map(c=>{
      const p=wordPin(c);
      return {a:{t:p,shp:'sq',s:'mid'}, b:{t:c[2],shp:'sq',s:'mid'}, id:'p'+p+'|'+c[2]};
    });
  }
  // chengyu：把成语拆成字块配对，点两块拼出完整成语即消除（每局 n 个成语）
  return pickChengyus(g,n).map((yu,i)=>{
    // 前2个保证拆成 单字+三字，其余 双字+双字（四字成语有35%概率拆单字）
    const [x,y]=(i<2 && yu.length===4) ? [yu[0], yu.slice(1)] : splitCheng(yu);
    return {a:{t:x,shp:x.length===1?'circle':'sq',s:x.length===1?'big':'mid'},
            b:{t:y,shp:y.length===1?'circle':'sq',s:y.length===1?'big':'mid'},
            id:'c'+yu};
  });
}

function startPairGame(kind){
  /* 关卡难度：每10关一档，对数10→12→14，超纲比例6%→40%，每关20%历史复习 */
  const lv=G.level||1;
  const n=10+Math.floor((lv-1)/10)*2;
  const extra=Math.min(0.4, 0.06+(lv-1)*0.011);
  const pairs=buildPairs(kind,n,extra);
  /* 记录本局内容到历史（供后续关卡20%复习抽取） */
  const used=[];
  for(const p of pairs){
    if(p.id[0]==='m'||p.id[0]==='w') used.push(p.id[1]);
    else if(p.id[0]==='p') used.push(p.id.split('|')[1][0]);
    else if(p.id[0]==='c') used.push(p.id.slice(1));
  }
  recordUsedList(used);
  const items=[];
  pairs.forEach((p,i)=>{
    /* 同一对分配两个不同的随机颜色，颜色与配对完全无关，防止按颜色试答案 */
    const c1=randInt(COLORS.length);
    let c2=randInt(COLORS.length);
    if(c2===c1) c2=(c1+1)%COLORS.length;
    items.push(Object.assign({}, p.a, {pair:i, done:false, id:p.id, side:0, color:c1}));
    items.push(Object.assign({}, p.b, {pair:i, done:false, id:p.id, side:1, color:c2}));
  });
  shuffle(items);
  pState={ items, first:null, second:null, lock:false, done:0 };
  qState.total=pairs.length;
  renderPairs();
  updateProgress();
}
function renderPairs(){
  const area=document.getElementById('gameArea');
  const grid=document.createElement('div');
  grid.className='match-grid';
  pState.items.forEach((it,i)=>{
    const b=document.createElement('div');
    b.className='bubble'+(it.shp==='sq'?' sq':'')+' '+it.s;
    b.textContent=it.t;
    b.style.backgroundColor=COLORS[it.color];
    b.style.animationDelay=(i*40)+'ms';
    b.onclick=()=>clickPair(i,b);
    grid.appendChild(b);
  });
  area.innerHTML='';
  area.appendChild(grid);
}
/* 成语/组词模式要求顺序：必须先点前面的块（成语前半/汉字），再点后面的块 */
function orderMode(){ return G.mode==='chengyu'||G.mode==='wordgame'; }
function clickPair(i,el){
  if(pState.lock||pState.items[i].done) return;
  SOUND.init(); SOUND.click();
  const it=pState.items[i];
  if(pState.first===null){
    if(orderMode() && it.side!==0){
      SOUND.wrong();
      el.classList.add('wrong');
      showTip(G.mode==='chengyu' ? '要先点成语前面的部分哦！' : '要先点左边的汉字哦！');
      later(()=>el.classList.remove('wrong'),420);
      return;
    }
    pState.first=i; el.classList.add('selected'); return;
  }
  if(pState.first===i) return;
  pState.second=i; el.classList.add('selected');
  pState.lock=true;
  const a=pState.items[pState.first], b=pState.items[pState.second];
  const els=document.querySelectorAll('#gameArea .bubble');
  later(()=>{
    const orderOK = orderMode() ? (a.side===0 && b.side===1) : true;
    if(a.pair===b.pair && orderOK){
      a.done=b.done=true; pState.done+=2;
      SOUND.pop(); fireworkAt(els[pState.first]); fireworkAt(els[pState.second]);
      els[pState.first].classList.add('done');
      els[pState.second].classList.add('done');
      if(G.mode==='chengyu' && a.id.charAt(0)==='c') showChengToast(a.id.slice(1));
      qState.right++; qState.combo++; qState.bestCombo=Math.max(qState.bestCombo,qState.combo);
      updateCombo();
      pState.first=null; pState.second=null; pState.lock=false;
      if(pState.done===pState.items.length){
        qState.total=pState.items.length/2;
        later(showResult,700);
      }
    }else{
      SOUND.wrong(); qState.wrong++; qState.combo=0; updateCombo();
      els[pState.first].classList.add('wrong');
      els[pState.second].classList.add('wrong');
      const f=pState.first, s=pState.second;
      /* 答错学习卡：展示第一个泡泡对应的学习内容 */
      showLearnCard(a.id);
      pState.first=null; pState.second=null;
      later(()=>{
        els[f].classList.remove('selected','wrong');
        els[s].classList.remove('selected','wrong');
        pState.lock=false;
      },500);
    }
  },260);
}

/* ================= 模式定义 ================= */
const MODES=[
  {id:'match',    name:'生字消消乐', icon:'💥', desc:'把汉字和拼音泡泡配对，消除所有泡泡！'},
  {id:'pinyinv',  name:'拼音消消乐', icon:'🔤', desc:'把组词和它的拼音配对，消灭所有泡泡'},
  {id:'chengyu',  name:'成语接龙消消乐', icon:'🐉', desc:'把成语拆成字块，点击两个字块拼出成语消除（取自接龙链）'},
  {id:'wordgame', name:'组词消消乐', icon:'🧩', desc:'把汉字和它的组词配对，消灭所有泡泡'}
];
const COLORS=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9','#F8C471','#82E0AA','#F1948A','#D7BDE2'];

/* ================= 背景飘浮动画 ================= */
(function bg(){
  const cv=document.getElementById('bgCanvas'), ctx=cv.getContext('2d');
  let W,H; const dots=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  resize(); addEventListener('resize',resize);
  for(let i=0;i<46;i++){
    dots.push({x:Math.random(),y:Math.random(),r:1.5+Math.random()*3,
      vx:(Math.random()-.5)*.0004, vy:(Math.random()-.5)*.0004,
      c:['#ffd93d','#4d96ff','#ff9f43','#6bcb77','#ff6b6b'][i%5],a:.12+Math.random()*.3});
  }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    dots.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0||d.x>1) d.vx*=-1; if(d.y<0||d.y>1) d.vy*=-1;
      ctx.beginPath(); ctx.arc(d.x*W,d.y*H,d.r,0,7);
      ctx.fillStyle=d.c; ctx.globalAlpha=d.a; ctx.fill();
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(loop);
  })();
})();

saveCoins();
